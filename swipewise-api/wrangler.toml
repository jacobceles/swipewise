# Cloudflare Worker config for the SwipeWise catalog read API.
#
# The bucket is fully private: the Worker reads every object — catalog, brands,
# and card art — through the `CATALOG` binding. Nothing is served from a public
# r2.dev URL. Card art goes out via the Worker's /cards route (edge-cached).
#
# Deploy:  npm run deploy      Local dev:  npm run dev

name = "swipewise-api"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
workers_dev = true

# R2 bucket holding assets/{catalog,brands,manifest}.json and cards/*.
[[r2_buckets]]
binding = "CATALOG"
bucket_name = "swipewise-assets"

# Per-IP rate limit for the public data routes (the Worker reads `env.RL`).
# The bucket is public + unauthenticated, so this caps a scraper before it can
# burn the free-plan daily request quota. 60 requests / 10s per IP per PoP —
# generous for a cold app boot (a few JSON fetches + card images) yet throttles
# a sustained loop. /healthz is exempt in code so uptime monitors aren't hit —
# it is edge-cached instead (30s), so the exemption can't be used to hammer R2.
# If this binding is ever absent the Worker logs an error on every request:
# unbound means UNTHROTTLED, and nothing else would tell you.
[[ratelimits]]
name = "RL"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 10

[observability]
enabled = true
