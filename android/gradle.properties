org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin is REQUIRED on AGP 9, not optional. package_info_plus 10.2.1
# guards its `apply(plugin = "org.jetbrains.kotlin.android")` on `agpMajor < 9`
# alone, then configures KotlinAndroidProjectExtension unconditionally — so with
# AGP 9 and this set to false, nothing provides that extension and its build
# fails. firebase_app_check 0.4.6 guards on both conditions and works either way.
android.builtInKotlin=true
# AGP 9's new DSL interfaces. AGP 10 removes this opt-out entirely, so it has to go
# eventually — but the blocker is FLUTTER'S OWN Gradle plugin, not ours and not a
# third-party one. Tried `true` on 2026-08-13 against Flutter 3.47 (latest stable):
#
#   Failed to apply plugin 'dev.flutter.flutter-gradle-plugin'.
#   > class …dsl.ApplicationExtensionImpl$AgpDecorated_Decorated cannot be cast to
#     class com.android.build.gradle.AbstractAppExtension
#
# Flutter's own fix hint is "update flutter", which we already have. Nothing on our
# side can unblock it, so retry only after a Flutter release notes new-DSL support.
android.newDsl=false
