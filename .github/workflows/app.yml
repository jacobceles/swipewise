# Flutter app CI.
#
# Two jobs, and the second is the point of the whole file:
#
#   analyze-test  — `flutter analyze` + the unit suite. Cheap, runs on every PR.
#   release-gate  — builds the real release APK and runs `tool/verify_release_apk.py`.
#                   Push-to-main only, because it needs the keys file.
#
# What the gate actually asserts, as of 2026-08-10:
#   - the keys file carries no SOPHTRON_* and no GOOGLE_PLACES_KEY
#   - it DOES carry PLACES_PROXY_URL and R2_BASE_URL (absence ships a dead
#     Stores tab, which is a silent failure worth failing the build over)
#   - the APK contains no `AIza...` string beyond the Firebase key that
#     google-services.json declares — this is what catches a Places key
#     coming back by any route
#   - no HMAC scheme marker, and the app's own UI strings are still present
#     so an empty shell cannot pass by satisfying only the absence checks
#
# Why the release gate exists: the app ships ONE binary for both tiers (Pro is an
# in-app subscription, so the Pro code is present and dormant for everyone). The
# only thing separating the published app from a credential leak is which keys
# file the release was built with. That is a one-word mistake, it produces a
# perfectly working APK, and nothing about the artifact looks wrong. So it gets
# checked mechanically rather than remembered.
#
# `flutter clean` before the release build is NOT optional — the release AOT
# snapshot has been observed going stale, which would make this gate verify an
# older binary and pass while telling you nothing.
#
# ── Secrets ──────────────────────────────────────────────────────────────────
# None. The gate reads the committed keys.free.json, which holds two public
# URLs and no credential.
#
# It used to read a KEYS_FREE_JSON repository secret. That was a second copy of
# the same config, and on 2026-08-10 the two drifted: the secret still carried
# the retired GOOGLE_PLACES_KEY, so CI built a release APK with a credential in
# it. The gate caught that on its first real run — which is the argument for
# both the gate and for having one source of truth rather than two.
#
# The aggregator credentials were never here and must not be: uploading them so
# the gate could grep for their exact values would put live secrets where a bad
# workflow edit could read them, to catch a mistake fully visible in the build
# input. The stronger value-grep still runs locally, where keys.pro.json is on
# disk.

name: app

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch: {}

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release-gate:
    # No `if:` guard any more, and that is the point. The gate used to need a
    # repository secret, which forced it to push-on-main only — so the one check
    # that catches a credential reaching the binary could not run on the pull
    # request that introduced it. keys.free.json is now committed and carries no
    # credential, so this needs nothing privileged and guards every PR too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      # Mandatory: a stale AOT snapshot would make the gate below inspect an
      # older binary and pass without checking anything current.
      - run: flutter clean
      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define-from-file=keys.free.json \
            --obfuscate --split-debug-info=build/symbols

      - name: Verify no credentials reached the APK
        run: python3 tool/verify_release_apk.py

