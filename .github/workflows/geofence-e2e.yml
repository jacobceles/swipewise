name: geofence-e2e

on:
  # Qualification depends on app, fixture, configuration and collector inputs;
  # path filters can silently omit one of those dependencies.
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: geofence-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geofence-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: flutter pub get

      - name: Run geofence qualification oracle, collector guard, and route tests
        run: |
          mkdir -p build/geofence-qualification
          python3 -B -m unittest discover -s tool -p 'test_*.py' -v
          python3 -B tool/geofence_qualification/check_oracle_mutations.py \
            --output build/geofence-qualification/oracle-mutations.json

      - name: Run Flutter nearby and dwell qualification tests
        run: |
          flutter test \
            test/nearby/ \
            test/api/settings_repository_dwell_test.dart \
            test/screens/alert_timing_test.dart
        env:
          TZ: America/New_York

      - name: Prepare Android Gradle configuration
        run: |
          flutter build apk --debug --config-only \
            --dart-define-from-file=keys.free.json

      - name: Build and lint standalone qualification observer APK
        working-directory: android
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/observer-test.keystore" \
            -storepass android -keypass android \
            -alias qualification -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Qualification Observer Test Only"
          ./gradlew -p ../tool/geofence_qualification/observer \
            --no-daemon --max-workers=2 \
            -Pandroid.builder.sdkDownload=false \
            -PobserverKeystore="$RUNNER_TEMP/observer-test.keystore" \
            assembleDebug lintDebug

      - name: Run Android native geofence unit tests and lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2

      - name: Upload qualification evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geofence-qualification-evidence
          path: |
            build/geofence-qualification/
            build/app/test-results/testDebugUnitTest/
            build/app/reports/lint-results-debug.xml
            tool/geofence_qualification/observer/build/reports/lint-results-debug.xml
