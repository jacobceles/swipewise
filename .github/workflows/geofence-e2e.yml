name: geofence-e2e

on:
  pull_request:
    paths:
      - 'android/**'
      - 'lib/nearby/**'
      - 'tool/test_geofence_e2e.py'
      - 'tool/generate_gpx_test_route.py'
      - 'test/fixtures/gpx/**'
  workflow_dispatch: {}

concurrency:
  group: geofence-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geofence-e2e:
    # macos-14 runs on Apple Silicon (M1/M2) with native arm64 virtualization
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define-from-file=keys.free.json

      - name: Run Geofence E2E Suite in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: |
            adb wait-for-device
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.appsoflife.swipewise.dev android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.appsoflife.swipewise.dev android.permission.ACCESS_BACKGROUND_LOCATION
            adb shell pm grant com.appsoflife.swipewise.dev android.permission.POST_NOTIFICATIONS
            adb shell pm grant com.appsoflife.swipewise.dev android.permission.ACTIVITY_RECOGNITION
            adb shell pm grant com.appsoflife.swipewise.dev android.permission.SCHEDULE_EXACT_ALARM 2>/dev/null || true
            python3 tool/test_geofence_e2e.py -v

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geofence-failure-logs
          path: |
            test/fixtures/gpx/
